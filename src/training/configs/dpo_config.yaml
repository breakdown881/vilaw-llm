# ==============================================================================
# VILAW-LLM: DPO ALIGNMENT HYPERPARAMETER CONFIGURATION
# Framework: Hugging Face TRL (DPOTrainer) + Unsloth
# Target Hardware: Google Colab Free T4 GPU (16GB VRAM)
# ==============================================================================

model:
  # Base model nạp từ LoRA Adapter của SFT mà chúng ta vừa train ở Sprint 3
  sft_adapter_path: "./vilaw-sft-lora"
  base_model_name: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 2048
  load_in_4bit: true

dpo:
  beta: 0.1                   # Hệ số KL penalty (0.1 là chuẩn mực vàng)
  loss_type: "sigmoid"        # Chuẩn DPO loss cổ điển
  max_prompt_length: 512      # Giới hạn độ dài prompt câu hỏi
  max_length: 1536            # Độ dài tối đa của câu trả lời chosen/rejected

training:
  output_dir: "./vilaw-dpo-checkpoints"
  num_train_epochs: 1         # DPO chỉ cần 1 epoch là đủ để căn chỉnh phong cách
  per_device_train_batch_size: 1 # DPO tốn VRAM gấp đôi SFT (vì phải forward cả chosen & rejected)
  gradient_accumulation_steps: 16 # Effective batch size = 1 * 16 = 16
  learning_rate: 0.000005     # 5e-6: Tốc độ học RẤT NHỎ (tránh làm mất kiến thức SFT)
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  weight_decay: 0.01
  optim: "adamw_8bit"
  fp16: true
  logging_steps: 5
  save_strategy: "no"
  report_to: "none"
  seed: 42

export:
  dpo_adapter_dir: "./vilaw-dpo-lora"
  dpo_merged_dir: "./vilaw-dpo-merged-16bit"
