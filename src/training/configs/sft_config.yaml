# ==============================================================================
# VILAW-LLM: SFT HYPERPARAMETER CONFIGURATION
# Framework: Unsloth + HuggingFace TRL (SFTTrainer)
# Target Hardware: Google Colab Free T4 GPU (16GB VRAM)
# ==============================================================================

# 1. Base Model & Tokenizer
model:
  base_model_name: "Qwen/Qwen2.5-7B-Instruct"
  max_seq_length: 2048       # Đủ dài cho văn bản pháp lý phức tạp
  load_in_4bit: true          # QLoRA 4-bit (NF4) quantization
  dtype: null                 # Tự động nhận diện (Float16 cho T4)

# 2. LoRA Adapter Configuration
lora:
  r: 16                       # Rank: 16 là điểm cân bằng vàng giữa bộ nhớ và hiệu năng
  lora_alpha: 32              # Thường đặt alpha = 2 * r
  lora_dropout: 0             # Unsloth tối ưu 0 dropout để tăng tốc
  target_modules:             # Áp dụng cho cả Attention và MLP layers
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_gradient_checkpointing: "unsloth" # Tiết kiệm 30% VRAM

# 3. Training Arguments
training:
  output_dir: "./vilaw-checkpoints"
  num_train_epochs: 3         # 3 epochs là tiêu chuẩn cho domain SFT
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8 # Effective batch size = 2 * 8 = 16
  learning_rate: 0.0002       # 2e-4 là tốc độ học tối ưu cho LoRA
  lr_scheduler_type: "cosine" # Giảm dần theo hàm cos
  warmup_ratio: 0.03          # 3% số step đầu làm nóng trọng số
  weight_decay: 0.01
  optim: "adamw_8bit"         # Optimizer 8-bit tiết kiệm VRAM
  fp16: true                  # T4 GPU hỗ trợ mạnh FP16 (chưa có BF16)
  bf16: false
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  packing: false              # Để false để bảo đảm toàn vẹn từng điều luật
  report_to: "none"           # Đổi thành "wandb" nếu muốn log lên Weights & Biases

# 4. Export & Merging
export:
  sft_merged_dir: "./vilaw-sft-merged"
  save_method: "merged_16bit" # Xuất ra mô hình 16-bit đầy đủ để phục vụ vLLM/Ollama
